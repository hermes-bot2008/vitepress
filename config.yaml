# Quantdesk Ultra - Configuration File
# =====================================

# General Settings
general:
  name: "Quantdesk Ultra AI"
  version: "1.0.0"
  log_level: "INFO"
  
# Trading Settings
trading:
  initial_capital: 10000.0
  default_lot_size: 0.01
  max_slippage_pips: 1.0
  commission_per_trade: 0.0
  
# Hyper Scalper Strategy
hyper_scalper:
  symbol: "XAUUSD"
  lot_size: 0.01
  tp_pips: 1.5
  sl_pips: 2.0
  max_positions: 50
  max_spread: 3.0
  rsi_period: 3
  rsi_upper: 80
  rsi_lower: 20
  tick_ma_period: 5
  min_volatility: 0.3
  max_volatility: 5.0
  max_daily_trades: 20000

# Momentum Strategy
momentum:
  symbol: "EURUSD"
  lot_size: 0.01
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14
  rsi_threshold: 50
  atr_period: 14
  atr_multiplier: 2.0
  risk_reward_ratio: 2.0

# Mean Reversion Strategy
mean_reversion:
  symbol: "GBPUSD"
  lot_size: 0.01
  bb_period: 20
  bb_std: 2.0
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  zscore_period: 20
  zscore_threshold: 2.0
  atr_period: 14
  atr_multiplier: 1.5

# Risk Management
risk_management:
  initial_capital: 10000.0
  max_daily_loss: 100.0
  max_daily_loss_percent: 2.0
  max_position_size: 0.1
  max_open_positions: 10
  max_drawdown_percent: 10.0
  use_equity_protection: true
  equity_protection_percent: 10.0
  max_risk_per_trade: 1.0
  max_leverage: 10.0

# Backtesting Settings
backtesting:
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  timeframe: "1H"
  commission: 0.0
  slippage: 0.0
  
# Data Sources
data_sources:
  yahoo_finance:
    enabled: true
    default_interval: "1h"
  
  csv_files:
    enabled: true
    directory: "./data"
  
  generate_sample:
    enabled: true
    volatility: 0.005

# Output Settings
output:
  save_trades: true
  save_results: true
  save_charts: true
  output_directory: "./results"
  
# Logging
logging:
  console: true
  file: true
  log_file: "quantdesk.log"
  level: "INFO"
